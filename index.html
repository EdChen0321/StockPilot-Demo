<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f7">
  <meta name="description" content="使用獨立範例資料，操作 StockPilot 倉管與營運流程的公開展示工作台。">
  <title>StockPilot 操作展示</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=5">
  <script src="app.js?v=5" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="StockPilot 操作展示首頁"><span class="brand-icon" aria-hidden="true">▦</span><span>StockPilot <span class="brand-label">操作展示</span></span></a>
    <div class="topbar-actions"><span class="demo-tag">公開範例工作台</span><a href="https://github.com/EdChen0321" class="profile-link">關於作者 ↗</a></div>
  </header>

  <div class="workbench">
    <aside class="sidebar" aria-label="工作台導覽">
      <div class="project-switch" role="group" aria-label="選擇展示專案">
        <button type="button" data-mode="warehouse" aria-pressed="true">倉管系統</button>
        <button type="button" data-mode="operations" aria-pressed="false">營運系統</button>
      </div>
      <nav id="module-nav" aria-label="功能選單"></nav>
      <div class="sidebar-bottom">
        <button id="reset-demo" class="reset-button" type="button">重設範例資料</button>
        <a id="repo-link" href="https://github.com/EdChen0321/StockPilot-Warehouse">查看專案原始碼 ↗</a>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <div class="workspace-head">
        <div><p class="breadcrumb" id="breadcrumb"></p><h1 id="page-title"></h1><p class="page-description" id="page-description"></p></div>
        <div id="primary-action"></div>
      </div>
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <div id="view"></div>
      <div class="demo-disclosure">此頁使用獨立範例資料，在瀏覽器內模擬主要操作。資料不會寫入兩個專案的系統；完整功能與目前限制以各專案 README 為準。</div>
    </main>
  </div>
</body>
</html>
